[tool.poetry]
name = "marketmind"
version = "0.1.0"
description = "AI-powered stock market decision-support agent"
readme = "README.md"
license = "MIT"
packages = [{ include = "marketmind", from = "src" }]

[tool.poetry.scripts]
marketmind = "marketmind.cli:app"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
# LLM clients
openai = ">=1.60.0"
anthropic = ">=0.40.0"
# Agent framework
langchain = ">=0.3.0"
langchain-openai = ">=0.3.0"
langchain-anthropic = ">=0.3.0"
langgraph = ">=0.3.0"
# Market data
yfinance = ">=0.2.40"
# CLI
typer = {version = ">=0.12.0", extras = ["all"]}
# Configuration
pydantic = ">=2.9.0"
pydantic-settings = ">=2.6.0"
python-dotenv = ">=1.0.0"
# Utilities
rich = ">=13.9.0"
httpx = ">=0.27.0"
edgartools = "^5.20.2"
chromadb = "^1.5.2"
sentence-transformers = "^5.2.3"
feedparser = "^6.0.12"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.8.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: tests that require network access (deselect with '-k not network')",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
